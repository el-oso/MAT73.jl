name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.version == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1.11', '1.12', 'nightly']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: lcov.info
          parallel: true
          flag-name: julia-${{ matrix.version }}

  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true

  trim:
    # The authoritative `--trim=safe` gate. The TrimCheck test item is a dev-time heuristic:
    # it analyses stock Base while juliac raises max_args, and it does not model finalizers,
    # so only a real build settles whether a trimmed binary links and runs.
    name: juliac --trim=safe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'   # the juliac driver ships with Julia from 1.12
      - uses: julia-actions/cache@v2
      - name: Resolve the build environment
        run: julia --project=juliac -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Build and compare against the Julia path
        run: julia --project=juliac juliac/build.jl
